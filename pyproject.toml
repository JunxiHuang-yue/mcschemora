[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "mcschemora"
dynamic = ["version"]
authors = [{ name = "MCSchemora contributors" }]
description = "Minecraft schematic authoring, editing, conversion, and rendering"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT AND MPL-2.0 AND LicenseRef-Minecraft-Assets"
license-files = ["LICENSE", "bindings/python/NOTICE", "data/block-models/LICENSE"]
keywords = ["minecraft", "schematic", "litematic", "nbt", "rendering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/tiltedlabs-ai/mcschemora"
Documentation = "https://tiltedlabs-ai.github.io/mcschemora/"
Issues = "https://github.com/tiltedlabs-ai/mcschemora/issues"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
locked = true
python-source = "bindings/python/python"
module-name = "mcschemora._core"
include = [
    { path = "licenses/**/*", from = "out-dir", to = "mcschemora/" },
]
exclude = ["**/__pycache__/**", "**/*.pyc", "bindings/python/python/mcschemora/licenses/**/*"]

[dependency-groups]
dev = [
    "maturin>=1.15,<2",
    "ruff>=0.14,<1",
    "nbtlib>=2,<3",
    "litemapy>=0.11.0b0,<0.12",
]
docs = [
    "zensical>=0.1.2,<0.2",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
