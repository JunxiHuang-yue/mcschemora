[package]
name = "mcschemora-wasm"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
description = "Browser bindings for Minecraft schematic authoring, editing, and conversion"
license = "MIT"
repository = "https://github.com/tiltedlabs-ai/mcschemora"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
mcschemora = { path = "../.." }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
