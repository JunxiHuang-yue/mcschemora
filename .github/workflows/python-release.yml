name: Python release files

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      visuals:
        description: Check textured rendering after online preparation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: |
          make setup
          make lint

  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheel from the source archive
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          rust-toolchain: '1.88.0'
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: --release --locked --sdist --out dist
      - name: Check distributions
        run: |
          python scripts/check_distributions.py dist
          python -m pip install 'twine==6.2.0'
          python -m twine check --strict dist/*
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match the package version'
          PY
      - name: Install and check Python 3.12 wheel
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_ROOT: ${{ github.workspace }}
          CHECK_VISUALS: ${{ inputs.visuals || false }}
        run: |
          python -m pip install --no-deps --no-index --find-links "$PACKAGE_ROOT/dist" mcschemora
          if [ "$CHECK_VISUALS" = true ]; then
            python -I "$PACKAGE_ROOT/scripts/verify_package.py" --visuals
          else
            python -I "$PACKAGE_ROOT/scripts/verify_package.py"
          fi
      - name: Check conversion corpus
        if: matrix.name == 'linux-x86_64'
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_ROOT: ${{ github.workspace }}
        run: |
          python -m pip install 'nbtlib==2.0.4'
          python -I "$PACKAGE_ROOT/scripts/verify_conversion.py"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install and check Python 3.10 wheel
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_ROOT: ${{ github.workspace }}
        run: |
          python -m pip install --no-deps --no-index --find-links "$PACKAGE_ROOT/dist" mcschemora
          python -I "$PACKAGE_ROOT/scripts/verify_package.py"
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: matrix.name == 'linux-x86_64'
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  release-files:
    needs: [wheels, lint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: source
          path: dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-release
          path: dist/*
          if-no-files-found: error
